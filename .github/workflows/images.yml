# GitHub Actions: build & publish the container image for the HYBRID
# (stdio + HTTP/SSE) mcp-forgejo server. Because it supports HTTP/SSE, an image
# is REQUIRED (R1).
#
# Image tags (see SKILL.md R3/R4):
#   On every git tag X  ->  X, X-{timestamp}, X-{commit}, X-{commit}-{timestamp}
#   On every master commit -> master-{commit}, master-{timestamp}, master-{commit}-{timestamp}
#
# Default branch MUST be `master` (R2).
# Hosted on GitHub.com; the image is published to GitHub Container Registry.

name: images

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/teran/mcp-forgejo

jobs:
  build-and-publish:
    name: Build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          COMMIT=${GITHUB_SHA::7}
          TAGS=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG=${GITHUB_REF_NAME}
            TAGS+=("${{ env.IMAGE }}:${TAG}")
            TAGS+=("${{ env.IMAGE }}:${TAG}-${TIMESTAMP}")
            TAGS+=("${{ env.IMAGE }}:${TAG}-${COMMIT}")
            TAGS+=("${{ env.IMAGE }}:${TAG}-${COMMIT}-${TIMESTAMP}")
          else
            TAGS+=("${{ env.IMAGE }}:master-${COMMIT}")
            TAGS+=("${{ env.IMAGE }}:master-${TIMESTAMP}")
            TAGS+=("${{ env.IMAGE }}:master-${COMMIT}-${TIMESTAMP}")
          fi
          # join with comma
          IFS=, ; echo "tags=${TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6

      - name: Build binary + image (make container-image)
        # Binds to the build-system interface (R07/N31). `make container-image`
        # runs `goreleaser build --snapshot --clean --single-target --output
        # dist/mcp-forgejo` (B4 — the Dockerfile only copies the GoReleaser
        # binary into the image; no in-image compile) then
        # `docker build -t mcp-forgejo .`.
        run: make container-image

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image (R3/R4)
        # `make container-image` tags the local image as mcp-forgejo:latest.
        # Retag it into the computed ghcr.io tags (X / master-* per R3/R4) and
        # push each. (For a single-image push, `make container-image push=true`
        # pushes the mcp-forgejo image directly.)
        run: |
          IFS=, read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for t in "${TAGS[@]}"; do
            docker tag mcp-forgejo "$t"
            docker push "$t"
          done

