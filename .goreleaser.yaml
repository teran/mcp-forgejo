# GoReleaser configuration for mcp-forgejo.
#
# The container image must NOT rebuild the binary: the Dockerfile just copies a
# binary produced by GoReleaser (see .github/workflows/images.yml). This keeps a
# single, verified build pipeline and avoids recompiling in Docker.
#
# Build metadata:
#   version:     from git tag (R3) or master commit (R4)
#   main:        ./cmd/mcp-forgejo
#   ldflags:     -s -w (strip) + version stamping via goreleaser's built-ins

version: 2

project_name: mcp-forgejo

before:
  hooks:
    - go mod tidy

builds:
  # The main server binary — static, CGO disabled, for the runtime image.
  - id: server
    main: ./cmd/mcp-forgejo
    binary: mcp-forgejo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

release:
  # Publish a GitHub release when a tag is pushed; the images workflow
  # separately builds/publishes the container image.
  github:
    owner: teran
    name: mcp-forgejo

# `goreleaser build` (used by the images workflow) only produces binaries; it
# does not publish archives, checksums or releases.
