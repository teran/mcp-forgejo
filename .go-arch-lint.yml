# go-arch-lint dependency rules for the mcp-forgejo Go MCP server.
# Docs: https://github.com/fe3dback/go-arch-lint
#
# The intended dependency architecture (Clean / DDD layers):
#
#   cmd/mcp-forgejo          composition root — wires config, logging, the
#                            Forgejo client, the tool registry and the chosen
#                            transport driver. May import every internal package.
#   internal/domain          pure entities (Repo, File, Issue, PullRequest,
#                            Release, Organization, Comment, Branch). No deps.
#   internal/application     use cases / tool handlers. Depends only on domain
#                            interfaces.
#   internal/infrastructure  the Forgejo REST client + HTTP transport. Depends
#                            only on domain interfaces.
#   internal/server          MCP tool registry + transport wiring (stdio driver,
#                            http/sse driver). Depends on domain/application/
#                            infrastructure.
#   internal/config          envconfig-driven configuration. No internal deps.
#   internal/logging         logrus setup, channel per transport. No internal
#                            deps.
#
# Layer rule: application and infrastructure never import each other; they
# communicate through interfaces defined in domain. server is the only layer
# that knows both application and infrastructure.
#
# Run locally:  go-arch-lint check
# Run in CI:    see .github/workflows/ci.yml (arch job)

version: 3
workdir: .

components:
  cmd:
    in: cmd/**
  domain:
    in: internal/domain/**
  application:
    in: internal/application/**
  infrastructure:
    in: internal/infrastructure/**
  server:
    in: internal/server/**
  config:
    in: internal/config/**
  logging:
    in: internal/logging/**
  e2e:
    in: e2e/**

# Vendor libraries used by specific components (allowed via `canUse` below).
vendors:
  mcp-sdk:     { in: github.com/modelcontextprotocol/go-sdk/** }
  logrus:      { in: [ github.com/sirupsen/logrus, github.com/sirupsen/logrus/** ] }
  envconfig:   { in: [ github.com/kelseyhightower/envconfig, github.com/kelseyhightower/envconfig/** ] }
  resty:       { in: [ resty.dev/v3, resty.dev/v3/** ] }
  docker-testsuite: { in: github.com/teran/go-docker-testsuite/** }
  testify:     { in: [ github.com/stretchr/testify, github.com/stretchr/testify/** ] }

# Global rules. depOnAnyVendor = false keeps us honest about external deps.
# deepScan is left OFF: the server layer intentionally wires dependencies by
# injection (it passes infrastructure.Client into application use-cases), and
# deepScan's method-call analysis treats that legitimate DI as a violation.
allow:
  depOnAnyVendor: false
  deepScan: false

# Dependency rules between components. Every other edge is forbidden.
deps:
  # 1. cmd is the composition root; it may import the internal packages and the
  #    MCP SDK + logger.
  cmd:
    mayDependOn:
      - domain
      - application
      - infrastructure
      - server
      - config
      - logging
    canUse:
      - mcp-sdk
      - logrus

  # 2. domain is the pure core: intentionally omitted from deps rules below, so
  #    it may not depend on any project component.

  # 3. application implements use cases over domain interfaces only.
  application:
    mayDependOn:
      - domain

  # 4. infrastructure implements the Forgejo REST client over domain interfaces,
  #    using resty.dev/v3 as its outbound HTTP transport (SPEC G9) and logrus
  #    for upstream request logging (L7).
  infrastructure:
    mayDependOn:
      - domain
    canUse:
      - resty
      - logrus

  # 5. server wires tools + transports; it may reach domain, application and
  #    infrastructure (it is the adapter that binds them together). It uses the
  #    MCP SDK and logrus for tool/request logging and the slog bridge (L7/L8).
  server:
    mayDependOn:
      - domain
      - application
      - infrastructure
    canUse:
      - mcp-sdk
      - logrus

  # 6. config and logging are leaf utilities (no internal deps) that use their
  #    own vendor libraries.
  config:
    canUse:
      - envconfig
  logging:
    canUse:
      - logrus

  # 7. e2e is the end-to-end test stand. It builds the MCP server in-process
  #    (infrastructure + server) and drives it with an MCP client; it also uses
  #    the go-docker-testsuite Forgejo wrapper to boot a real container, and
  #    testify/suite for the test harness. It is test-only and never imported by
  #    any production component.
  e2e:
    mayDependOn:
      - infrastructure
      - server
    canUse:
      - mcp-sdk
      - docker-testsuite
      - testify

# Paths excluded from dependency analysis (generated code, vendored deps).
exclude:
  - ./vendor
  - ./generated
